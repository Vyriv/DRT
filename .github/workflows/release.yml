name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish to Modrinth
        required: true
        default: "1.1.0"

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.minecraft }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       !github.event.release.prerelease &&
       !github.event.release.draft)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.2"
          - "26.3"

    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MC: ${{ matrix.minecraft }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          META="$(gh release view "$TAG" --repo "${{ github.repository }}" --json body,isDraft,isPrerelease,tagName)"
          DRAFT="$(printf '%s' "$META" | jq -r '.isDraft')"
          PRE="$(printf '%s' "$META" | jq -r '.isPrerelease')"
          printf '%s' "$META" | jq -r '.body // ""' > changelog.md

          if [ "$DRAFT" = "true" ]; then
            echo "Refusing to publish draft release $TAG"
            exit 1
          fi

          if [ "$PRE" = "true" ]; then
            echo "Refusing to publish prerelease $TAG"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not a stable DRT release version (expected N.N.N without v prefix)"
            exit 1
          fi

          MOD_VERSION="${TAG}+${MC}"
          JAR_NAME="DungeonRunTracker-${MOD_VERSION}.jar"
          DELIM="CHANGELOG_EOF_$(openssl rand -hex 8)"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"
          echo "jar_path=$JAR_NAME" >> "$GITHUB_OUTPUT"

          {
            echo "changelog<<$DELIM"
            cat changelog.md
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing $MOD_VERSION from GitHub Release $TAG"

      - name: Download release jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          JAR_NAME="${{ steps.meta.outputs.jar_name }}"

          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$JAR_NAME" \
            --clobber

          test -f "$JAR_NAME"
          echo "Downloaded $(wc -c < "$JAR_NAME") bytes: $JAR_NAME"

          # Reject sources jars and non-release artifacts if a pattern is too broad.
          case "$JAR_NAME" in
            *-sources.jar|*-dev.jar|*nightly*|*beta*)
              echo "Refusing artifact $JAR_NAME"
              exit 1
              ;;
          esac

      - name: Check Modrinth for existing version
        id: existing
        env:
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MOD_VERSION: ${{ steps.meta.outputs.mod_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Repository variable MODRINTH_PROJECT_ID is not configured"
            exit 1
          fi

          RESPONSE="$(curl -fsSL "https://api.modrinth.com/v2/project/${PROJECT_ID}/version")"
          MATCH="$(printf '%s' "$RESPONSE" | jq -r --arg v "$MOD_VERSION" '.[] | select(.version_number == $v) | .id' | head -n1)"

          if [ -n "$MATCH" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version_id=$MATCH" >> "$GITHUB_OUTPUT"
            echo "Modrinth version $MOD_VERSION already exists ($MATCH). Skipping upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing Modrinth version for $MOD_VERSION"
          fi

      - name: Publish to Modrinth
        if: steps.existing.outputs.exists != 'true'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}

          name: DungeonRunTracker ${{ steps.meta.outputs.mod_version }}
          version: ${{ steps.meta.outputs.mod_version }}

          channel: release
          loaders: fabric
          game-versions: ${{ matrix.minecraft }}
          environment: client_only

          files: ${{ steps.meta.outputs.jar_path }}

          changelog: ${{ steps.meta.outputs.changelog }}

          dependencies: |
            [
              {
                "project_id": "P7dR8mSH",
                "dependency_type": "required"
              }
            ]
